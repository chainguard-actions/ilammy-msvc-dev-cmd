name: Test vsversion input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          arch: x64
          vsversion: "2022"
        continue-on-error: true
      - name: Assert action ran with vsversion=2022 (succeeds on Windows, fails gracefully on Linux)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with vsversion=2022 (running on Windows)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected on non-Windows runner)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
